name: Check for Redox schema updates

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 07:15 UTC.
    - cron: "15 7 * * 0"

permissions:
  contents: read

concurrency:
  group: schema-updates
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gen_redox_lib
        uses: actions/checkout@v7.0.1
        with:
          path: gen_redox_lib

      - name: Check out redox
        uses: actions/checkout@v7.0.1
        with:
          repository: mmabey/redox
          ref: main
          path: redox
          fetch-depth: 0
          token: ${{ secrets.REDOX_REPO_TOKEN }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install both projects
        working-directory: gen_redox_lib
        run: |
          uv sync --locked
          uv pip install --python ../redox/.venv ../redox || true

      - name: Regenerate the redox library
        working-directory: gen_redox_lib
        env:
          REDOX_SESSION: ${{ secrets.REDOX_SESSION }}
        run: |
          if [ -n "$REDOX_SESSION" ]; then
            uv run gen-redox-lib --force-download
          else
            uv run gen-redox-lib
          fi

      - name: Lint + type-check the regenerated tree
        working-directory: redox
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Test the regenerated tree
        working-directory: redox
        run: |
          uv sync --locked
          uv run pytest

      - name: Open a PR (or heartbeat) on redox
        working-directory: gen_redox_lib
        env:
          GH_TOKEN: ${{ secrets.REDOX_REPO_TOKEN }}
        run: |
          git -C ../redox config user.name "gen-redox-lib bot"
          git -C ../redox config user.email "noreply@users.noreply.github.com"
          uv run gen-redox-lib-pr
