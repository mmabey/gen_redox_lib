name: Check for Redox schema updates

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 07:15 UTC.
    - cron: "15 7 * * 0"

permissions:
  contents: write # push the heartbeat branch to this repo

concurrency:
  group: schema-updates
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gen_redox_lib
        uses: actions/checkout@v7.0.1
        with:
          path: gen_redox_lib
          fetch-depth: 0

      - name: Check out redox
        uses: actions/checkout@v7.0.1
        with:
          repository: mmabey/redox
          ref: main
          path: redox
          fetch-depth: 0
          token: ${{ secrets.REDOX_REPO_TOKEN }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install gen_redox_lib
        working-directory: gen_redox_lib
        run: uv sync --locked

      - name: Regenerate the redox library from the live schema
        working-directory: gen_redox_lib
        run: uv run gen-redox-lib --force-download

      - name: Lint the regenerated tree
        working-directory: redox
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Test the regenerated tree
        working-directory: redox
        run: |
          uv sync --locked
          uv run pytest

      - name: Open a regeneration PR on redox, or heartbeat gen_redox_lib
        working-directory: gen_redox_lib
        env:
          GH_TOKEN: ${{ secrets.REDOX_REPO_TOKEN }}
        run: |
          for dir in . ../redox; do
            git -C "$dir" config user.name "gen-redox-lib bot"
            git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          done
          uv run gen-redox-lib-pr
