[project]
name = "gen_redox_lib"
version = "1.1.0"
description = "Code generator that produces the `redox` Pydantic model library from Redox's published JSON schema."
authors = [{ name = "Mike Mabey", email = "pypi@mikemabey.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
keywords = ["redox", "pydantic", "code-generation", "json-schema", "healthcare", "hl7"]
dependencies = [
    "click>=8.1",
    "requests>=2.32",
    "retry2>=0.9.5",
    "inflection>=0.5.1",
    "jinja2>=3.1",
    "ruff>=0.6",
]

[project.scripts]
gen-redox-lib = "gen_redox_lib.generate:main"
gen-redox-lib-pr = "gen_redox_lib.pull_request:main"

[project.urls]
Homepage = "https://github.com/mmabey/gen_redox_lib"
Repository = "https://github.com/mmabey/gen_redox_lib"
Issues = "https://github.com/mmabey/gen_redox_lib/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-snapshot>=0.9",
    "pre-commit>=3.0",
    "ruff>=0.6",
    "ty>=0.0.70",
    "coveralls>=3.0.1",
    "tomlkit>=0.13",
]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/snapshots", "gen_redox_lib/vendor", "gen_redox_lib/cache"]

[tool.ruff.lint]
extend-select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FLY",
    "FURB",
    "I",
    "ICN",
    "INP",
    "ISC",
    "N",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T100",
    "TC",
    "TID",
    "UP",
    "W",
]
# ANN/EM/TRY/PLR are dropped: this is internal codegen tooling, not a public API,
# and the generated *output* (which does ship) is held to the full rule set via
# gen_redox_lib/vendor/ruff.toml.
# Rules ruff's own docs list as conflicting with the formatter:
# https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
ignore = [
    "COM812",
    "COM819",
    "E111",
    "E114",
    "E117",
    "E101",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
    # This tool shells out to git/gh/ruff with fully hardcoded argv; the
    # subprocess-hardening rules are noise here.
    "S603",
    "S607",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["gen_redox_lib"]
known-third-party = ["pytest"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point of a test suite.
# S311: test-data randomization, not cryptography.
# PLR2004: literal expected values in assertions are normal test style.
"tests/**" = ["S101", "S311", "DTZ", "PLR2004", "INP001"]

[tool.coverage.run]
source = ["gen_redox_lib"]

[tool.ty.src]
exclude = ["tests/snapshots", "gen_redox_lib/vendor", "gen_redox_lib/cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/snapshots"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at <repo>/gen_redox_lib, not <repo>/src/gen_redox_lib.
module-root = ""
# Ship the Jinja templates and the pinned schema snapshot with the package.
source-include = ["gen_redox_lib/templates/*.jinja2", "gen_redox_lib/vendor/*"]
